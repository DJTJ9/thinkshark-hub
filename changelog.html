<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Changelog — ThinkShark</title>
  <meta name="description" content="ThinkShark Changelog — Patch Notes aller Projekte, Echolot der Releases." />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sonar-grid" aria-hidden="true"></div>
  <header class="topbar">
    <a class="wordmark wordmark--link" href="index.html">THINKSHARK</a>
    <span class="status"><span class="status__dot"></span>live</span>

  <main class="wrap">
    <section class="hero hero--sub">

  <script src="changelog.js" defer></script>
